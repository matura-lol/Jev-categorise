[project]
name = "jev-categorise"
version = "0.1.0"
description = "Classify and group exam questions with TypeSafe Jev (System One): typed dział, difficulty, solution method, answer form, capability vector and problem groups"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "morawskidotmy" }]
keywords = ["jev", "typesafe", "system-one", "classification", "education", "matura"]
dependencies = []

[project.urls]
Homepage = "https://matura.lol"
Source = "https://github.com/morawskidotmy/Jev-categorise"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_categorise"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "PIE", "RUF"]
